# Socket.IO server only. Vercel hosts the Next.js frontend.
services:
  - type: web
    name: sketch-sync-socket
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:socket
    healthCheckPath: /hello
    envVars:
      # The production URL and the Vercel preview URLs of the frontend.
      - key: CLIENT_ORIGIN
        value: https://sketch-sync-board.vercel.app,https://sketch-sync-board-*-dhruvs-projects-b5f51ca4.vercel.app
